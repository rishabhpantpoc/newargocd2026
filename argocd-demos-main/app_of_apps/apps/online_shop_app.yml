apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-shop-child        # Child app name
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rishabhpantpoc/newargocd2026.git # Repo containing child apps(that you have forked and cloned earlier)
    targetRevision: main
    path: argocd-in-one-shot-main/05_argocd_features/app_of_apps/online_shop  # path of Online Shop app in `argocd-demos` repo
  destination:
    server: https://192.168.49.2:8443 # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
